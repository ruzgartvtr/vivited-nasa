name: vivited
description: "Vivited — Martian Exploration Intelligence System. A layered, multi-mission map of Jezero crater for planning and rehearsing a Marswalk."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.15.0-72.0.dev

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_riverpod: ^3.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/

  fonts:
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
    - family: SchibstedGrotesk
      fonts:
        - asset: assets/fonts/SchibstedGrotesk.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
